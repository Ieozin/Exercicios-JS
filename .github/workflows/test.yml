name: Teste

on:
  push:
    branches: [main, master, exercicios/modulo-2]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checar código
        uses: actions/checkout@v3

      - name: Executar Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Permissões do Jest
        run: chmod +x node_modules/.bin/jest

      - name: Rodar Testes
        run: npm test

      # Alteração principal aqui ▼
      - name: Preparar Resultados
        if: success()
        run: |
          mkdir -p test-results
          cp ./test-results/index.html ./test-results/index.html

      - name: Relatório de erro
        if: failure()
        run: |
          mkdir -p test-results
          echo "<h1>Relatório de Testes</h1><p>Nenhum dado disponível</p>" > test-results/index.html

      - name: Enviar ao GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test-results
          keep_files: true